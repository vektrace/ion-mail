[package]
name = "ion-mail"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "6.0.0"
email_address = "0.2.9"
imap = "2.4.1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-async-persistent", "crypto-rust"] }
mailparse = "0.16.1"
native-tls = "0.2.18"
serde = "1.0.228"
toml = "1.1.2"
